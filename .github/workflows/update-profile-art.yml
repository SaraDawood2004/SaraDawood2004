name: Update Profile Art

on:
  schedule:
    # Runs every day at 06:17 UTC
    - cron: "17 6 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Setup Python
      # ----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ----------------------------------------------------
      # Fetch GitHub contribution data
      # ----------------------------------------------------

      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py

      # ----------------------------------------------------
      # Generate animated contribution heatmap
      # ----------------------------------------------------

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      # ----------------------------------------------------
      # Commit generated files
      # ----------------------------------------------------

      - name: Commit updated profile art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contribution heatmap"
          file_pattern: "data/contributions.json contrib-heatmap.svg"